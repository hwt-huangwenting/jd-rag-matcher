<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JD 匹配问答器</title>
<style>
  :root {
    --bg: #f4f5f9;
    --card: #ffffff;
    --ink: #161a27;
    --muted: #6b7280;
    --line: #e6e8ef;
    --brand: #4f46e5;
    --brand-dark: #4338ca;
    --brand-soft: #eef2ff;
    --teal: #0f766e;
    --danger: #b42318;
    --danger-soft: #fef3f2;
    --mono: "Cascadia Mono", "Consolas", "SFMono-Regular", monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(900px 420px at 12% -8%, #e6e9ff 0%, transparent 62%),
      radial-gradient(760px 380px at 96% 4%, #e0f2f1 0%, transparent 58%),
      var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei",
      "PingFang SC", "Hiragino Sans GB", sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    max-width: 1180px;
    margin: 0 auto;
    padding: 34px 22px 56px;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }

  .brand { display: flex; align-items: center; gap: 14px; }

  .logo {
    width: 46px; height: 46px;
    border-radius: 13px;
    background: linear-gradient(145deg, #6366f1, #4338ca);
    color: #fff;
    display: grid; place-items: center;
    font: 700 21px/1 var(--mono);
    box-shadow: 0 8px 18px rgba(79, 70, 229, .28);
  }

  h1 { margin: 0; font-size: 22px; letter-spacing: .2px; }

  .sub {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 13px;
  }

  .badges { display: flex; gap: 8px; flex-wrap: wrap; }

  .badge {
    padding: 6px 11px;
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, .72);
    border-radius: 999px;
    color: #475467;
    font: 12px/1.3 var(--mono);
    backdrop-filter: blur(4px);
  }

  .badge b { color: var(--brand); font-weight: 600; }

  main {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 350px;
    gap: 20px;
    align-items: start;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(23, 28, 45, .05);
  }

  .ask { padding: 20px 20px 18px; }

  .ask label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--muted);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  textarea {
    width: 100%;
    min-height: 92px;
    resize: vertical;
    padding: 14px 15px;
    border: 1.5px solid var(--line);
    border-radius: 12px;
    background: #fbfbfd;
    color: var(--ink);
    font: 15px/1.7 inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }

  textarea:focus {
    border-color: var(--brand);
    background: #fff;
    box-shadow: 0 0 0 4px rgba(79, 70, 229, .12);
  }

  .ask-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    margin-top: 14px;
    flex-wrap: wrap;
  }

  .params {
    display: flex;
    align-items: center;
    gap: 12px;
    color: var(--muted);
    font-size: 12px;
    flex-wrap: wrap;
  }

  .params label { display: flex; align-items: center; gap: 6px; margin: 0; text-transform: none; letter-spacing: 0; font-weight: 500; }

  .params input {
    width: 62px;
    padding: 5px 7px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: #fff;
    color: var(--ink);
    font: 12px var(--mono);
    outline: none;
  }

  .params input:focus { border-color: var(--brand); }

  .primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(140deg, #5b54f0, #4338ca);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 6px 16px rgba(79, 70, 229, .26);
    transition: transform .12s, box-shadow .12s, opacity .12s;
  }

  .primary:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 9px 20px rgba(79, 70, 229, .3); }
  .primary:disabled { opacity: .6; cursor: progress; }

  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255, 255, 255, .4);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
    display: none;
  }

  .loading .spinner { display: inline-block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  .examples {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px dashed var(--line);
  }

  .examples span { color: var(--muted); font-size: 12px; align-self: center; }

  .chip {
    padding: 5px 10px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: #fff;
    color: #4b5563;
    font-size: 12px;
    cursor: pointer;
    transition: .15s;
  }

  .chip:hover { border-color: #c7cdf9; background: var(--brand-soft); color: var(--brand-dark); }

  .error {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    border: 1px solid #fecdca;
    border-radius: 10px;
    background: var(--danger-soft);
    color: var(--danger);
    font-size: 13.5px;
    line-height: 1.6;
  }

  .upload-panel { margin-top: 14px; overflow: hidden; }

  .upload-panel summary {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 14px 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    list-style: none;
  }

  .upload-panel summary::-webkit-details-marker { display: none; }

  .upload-panel summary::after {
    content: "＋";
    margin-left: auto;
    color: var(--muted);
    font: 400 15px var(--mono);
  }

  .upload-panel[open] summary::after { content: "－"; }

  .summary-hint { color: var(--muted); font-size: 12px; font-weight: 400; }

  .upload-body { padding: 0 20px 18px; border-top: 1px solid var(--line); }

  .drop-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }

  .drop {
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 14px;
    border: 1.5px dashed #d5d9e5;
    border-radius: 11px;
    background: #fbfbfd;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }

  .drop:hover, .drop.dragging {
    border-color: var(--brand);
    background: var(--brand-soft);
  }

  .drop strong { font-size: 13px; }
  .drop span { color: var(--muted); font-size: 11.5px; line-height: 1.5; }

  .replace-line {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 12px;
    color: var(--muted);
    font-size: 12px;
    cursor: pointer;
  }

  .replace-line input { accent-color: var(--brand); }

  .upload-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .secondary {
    padding: 8px 14px;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: #fff;
    color: #344054;
    font-size: 13px;
    cursor: pointer;
    transition: .15s;
  }

  .secondary:hover:not(:disabled) {
    border-color: #c7cdf9;
    color: var(--brand-dark);
    background: var(--brand-soft);
  }

  .secondary:disabled { opacity: .6; cursor: progress; }

  .upload-status { font-size: 12px; line-height: 1.5; color: var(--muted); }
  .upload-status.loading { color: var(--brand-dark); }
  .upload-status.success { color: var(--teal); }
  .upload-status.error { color: var(--danger); }

  .answer-card { margin-top: 18px; overflow: hidden; }

  .answer-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #fbfbfe, #fff);
  }

  .answer-head h2 { margin: 0; font-size: 14px; letter-spacing: .04em; }

  .meta { color: var(--muted); font: 12px var(--mono); }

  .answer-body { padding: 6px 22px 20px; }

  .answer-body p {
    margin: 14px 0;
    font-size: 15.5px;
    line-height: 1.85;
    color: #242a3a;
  }

  .cite {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 24px;
    height: 20px;
    padding: 0 5px;
    margin: 0 2px;
    border: 0;
    border-radius: 6px;
    background: var(--brand-soft);
    color: var(--brand-dark);
    font: 600 12px/1 var(--mono);
    cursor: pointer;
    vertical-align: 2px;
    transition: .15s;
  }

  .cite:hover { background: #dfe4ff; transform: translateY(-1px); }
  .cite.invalid { background: var(--danger-soft); color: var(--danger); cursor: default; }

  .notice {
    margin: 16px 0;
    padding: 14px 16px;
    border: 1px dashed #cbd5e1;
    border-radius: 10px;
    background: #f8fafc;
    color: #475467;
    font-size: 14px;
    line-height: 1.7;
  }

  .cites { border-top: 1px solid var(--line); padding: 16px 20px 20px; background: #fcfcfe; }

  .cites h3 {
    margin: 0 0 12px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .12em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .cite-card {
    display: grid;
    grid-template-columns: 30px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: start;
    padding: 12px;
    border: 1px solid var(--line);
    border-radius: 11px;
    background: #fff;
    margin-bottom: 9px;
    transition: box-shadow .2s, border-color .2s, transform .2s;
  }

  .cite-card.flash {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px rgba(79, 70, 229, .14);
    transform: translateY(-1px);
  }

  .cite-rank {
    width: 28px; height: 28px;
    border-radius: 8px;
    background: var(--brand-soft);
    color: var(--brand-dark);
    display: grid; place-items: center;
    font: 700 12px var(--mono);
  }

  .cite-src { min-width: 0; }

  .path {
    display: block;
    font: 12.5px/1.5 var(--mono);
    color: #344054;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .section { display: block; margin-top: 2px; color: var(--muted); font-size: 12px; }

  .score { text-align: right; font: 12px var(--mono); color: var(--brand-dark); white-space: nowrap; }

  .bar {
    grid-column: 2 / 4;
    height: 4px;
    border-radius: 999px;
    background: #eef0f6;
    overflow: hidden;
  }

  .bar i {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(90deg, #6366f1, #22a6a0);
  }

  aside { position: sticky; top: 18px; padding: 18px; }

  aside h2 {
    margin: 0 0 4px;
    font-size: 14px;
    letter-spacing: .02em;
  }

  .aside-hint { margin: 0 0 14px; color: var(--muted); font-size: 12px; line-height: 1.5; }

  .result {
    border: 1px solid var(--line);
    border-radius: 11px;
    padding: 11px 12px;
    margin-bottom: 9px;
    background: #fff;
    transition: border-color .2s, background .2s;
  }

  .result.cited { border-color: #c7cdf9; background: #fbfbff; }
  .result.flash { box-shadow: 0 0 0 3px rgba(79, 70, 229, .14); }

  .result-top { display: flex; align-items: center; gap: 8px; }

  .rank {
    flex: none;
    width: 22px; height: 22px;
    border-radius: 6px;
    background: #f2f4f8;
    color: #475467;
    display: grid; place-items: center;
    font: 700 11px var(--mono);
  }

  .result.cited .rank { background: var(--brand-soft); color: var(--brand-dark); }

  .result-src { min-width: 0; flex: 1; }

  .result-src .path { font-size: 12px; }
  .result-src .section { font-size: 11.5px; }

  .result-score { font: 700 11.5px var(--mono); color: var(--brand-dark); }

  .result details { margin-top: 8px; }

  .result summary {
    cursor: pointer;
    color: var(--muted);
    font-size: 11.5px;
    list-style: none;
  }

  .result summary::-webkit-details-marker { display: none; }
  .result summary::before { content: "▸ "; }
  .result details[open] summary::before { content: "▾ "; }

  .snippet {
    margin: 8px 0 0;
    padding: 9px 10px;
    border-radius: 8px;
    background: #f7f8fc;
    color: #475467;
    font: 11.5px/1.7 var(--mono);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 220px;
    overflow: auto;
  }

  .empty {
    padding: 22px 8px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
  }

  footer {
    margin-top: 22px;
    color: #98a2b3;
    font-size: 12px;
    line-height: 1.7;
    text-align: center;
  }

  @media (max-width: 960px) {
    main { grid-template-columns: 1fr; }
    aside { position: static; order: 2; }
    .answer-card { margin-top: 18px; }
  }

  @media (max-width: 560px) {
    .shell { padding: 22px 14px 40px; }
    .ask-foot { align-items: stretch; }
    .primary { width: 100%; justify-content: center; }
    .drop-grid { grid-template-columns: 1fr; }
    .cite-card { grid-template-columns: 28px minmax(0, 1fr); }
    .score { grid-column: 2; text-align: left; }
    .bar { grid-column: 1 / 3; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand">
      <div class="logo">R</div>
      <div>
        <h1>JD 匹配问答器</h1>
        <p class="sub">检索简历与招聘 JD，生成带引用来源的回答 · 纯 Python 手写 RAG</p>
      </div>
    </div>
    <div class="badges" id="badges">
      <span class="badge">模型 <b id="badge-model">—</b></span>
      <span class="badge">top-k <b id="badge-topk">—</b></span>
      <span class="badge">阈值 <b id="badge-score">—</b></span>
      <span class="badge">索引 <b id="badge-index">—</b></span>
    </div>
  </header>

  <main>
    <div>
      <section class="card ask">
        <label for="question">向知识库提问</label>
        <textarea id="question" maxlength="300"
          placeholder="例如：这个岗位要求 RAG 经验，我匹配吗？"></textarea>

        <div class="ask-foot">
          <div class="params">
            <label>top-k <input id="top-k" type="number" min="1" max="20" step="1" value="6"></label>
            <label>阈值 <input id="min-score" type="number" min="0" max="1" step="0.01" value="0.52"></label>
          </div>
          <button class="primary" id="ask-btn" type="button">
            <span class="spinner" aria-hidden="true"></span>
            <span id="ask-label">提问</span>
          </button>
        </div>

        <div class="examples" id="examples">
          <span>试试：</span>
          <button class="chip" type="button">这个岗位要求 RAG 经验，我匹配吗</button>
          <button class="chip" type="button">候选人是否有 Flask 和 FastAPI 的使用经验？</button>
          <button class="chip" type="button">Python 后端岗位对 MySQL 和 Redis 有哪些要求？</button>
          <button class="chip" type="button">上海明天的天气怎么样？</button>
        </div>

        <div class="error" id="error" role="alert"></div>
      </section>

      <details class="card upload-panel" id="upload-panel">
        <summary>
          <span>知识库管理</span>
          <span class="summary-hint">上传简历 / 岗位 JD，保存后自动重建索引</span>
        </summary>
        <div class="upload-body">
          <div class="drop-grid">
            <label class="drop" id="drop-resume">
              <input type="file" id="file-resume" accept=".md,.txt" hidden>
              <strong>上传简历</strong>
              <span>单个 .md / .txt，保存为 resume.md</span>
            </label>
            <label class="drop" id="drop-jd">
              <input type="file" id="file-jd" accept=".md,.txt" multiple hidden>
              <strong>上传岗位 JD</strong>
              <span>可多选，保存到 knowledge/jd/</span>
            </label>
          </div>
          <label class="replace-line">
            <input type="checkbox" id="replace-jd">
            导入 JD 时清空 knowledge/jd 下的旧文件
          </label>
          <div class="upload-actions">
            <button class="secondary" id="rebuild-btn" type="button">手动重建索引</button>
            <span class="upload-status" id="upload-status" role="status"></span>
          </div>
        </div>
      </details>

      <section class="card answer-card" id="answer-card" hidden>
        <div class="answer-head">
          <h2>回答</h2>
          <span class="meta" id="meta"></span>
        </div>
        <div class="answer-body" id="answer" aria-live="polite"></div>
        <div class="cites" id="cites" hidden>
          <h3>引用来源</h3>
          <div id="cite-list"></div>
        </div>
      </section>
    </div>

    <aside class="card" id="aside">
      <h2>检索结果</h2>
      <p class="aside-hint">按余弦相似度降序排列，只展示超过阈值的文本块。</p>
      <div id="results">
        <div class="empty">提问后，这里会显示命中的文本块与分数。</div>
      </div>
    </aside>
  </main>

  <footer>
    API Key 仅保存在服务端 <code>.env</code>，不会发送到浏览器。检索与生成约需 2–5 秒。
  </footer>
</div>

<script>
(function () {
  "use strict";

  var config = null;
  var loading = false;
  var els = {
    question: document.getElementById("question"),
    askBtn: document.getElementById("ask-btn"),
    askLabel: document.getElementById("ask-label"),
    topK: document.getElementById("top-k"),
    minScore: document.getElementById("min-score"),
    error: document.getElementById("error"),
    answerCard: document.getElementById("answer-card"),
    answer: document.getElementById("answer"),
    meta: document.getElementById("meta"),
    cites: document.getElementById("cites"),
    citeList: document.getElementById("cite-list"),
    results: document.getElementById("results"),
    badgeModel: document.getElementById("badge-model"),
    badgeTopK: document.getElementById("badge-topk"),
    badgeScore: document.getElementById("badge-score"),
    badgeIndex: document.getElementById("badge-index"),
    fileResume: document.getElementById("file-resume"),
    fileJd: document.getElementById("file-jd"),
    replaceJd: document.getElementById("replace-jd"),
    rebuildBtn: document.getElementById("rebuild-btn"),
    uploadStatus: document.getElementById("upload-status")
  };

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function setLoading(value) {
    loading = value;
    els.askBtn.disabled = value;
    els.askBtn.classList.toggle("loading", value);
    els.askLabel.textContent = value ? "检索并生成中…" : "提问";
  }

  function showError(message) {
    els.error.textContent = message;
    els.error.style.display = "block";
  }

  function clearError() {
    els.error.textContent = "";
    els.error.style.display = "none";
  }

  function renderAnswer(text, total) {
    var escaped = escapeHtml(text);
    var withCites = escaped.replace(/\[(\d+)\]/g, function (match, raw) {
      var number = Number(raw);
      if (number < 1 || number > total) {
        return '<span class="cite invalid">' + match + "</span>";
      }
      return '<button class="cite" type="button" data-cite="' + number + '">[' + number + "]</button>";
    });
    var paragraphs = withCites.split(/\n{2,}/).filter(function (part) {
      return part.trim() !== "";
    });
    return paragraphs.map(function (part) {
      return "<p>" + part.replace(/\n/g, "<br>") + "</p>";
    }).join("");
  }

  function scoreWidth(score) {
    return Math.max(3, Math.min(100, score * 100)) + "%";
  }

  function buildCiteCard(item) {
    var card = document.createElement("div");
    card.className = "cite-card";
    card.dataset.citeCard = String(item.number);
    card.innerHTML =
      '<span class="cite-rank">[' + item.number + "]</span>" +
      '<span class="cite-src"><span class="path">' + escapeHtml(item.source) + "</span>" +
      '<span class="section">' + escapeHtml(item.section) + "</span></span>" +
      '<span class="score">' + item.score.toFixed(4) + "</span>" +
      '<span class="bar"><i style="width:' + scoreWidth(item.score) + '"></i></span>';
    return card;
  }

  function buildResult(item, citedSet) {
    var box = document.createElement("div");
    box.className = "result" + (citedSet.has(item.number) ? " cited" : "");
    box.dataset.resultNumber = String(item.number);

    var score = document.createElement("div");
    score.className = "result-top";
    score.innerHTML =
      '<span class="rank">' + item.number + "</span>" +
      '<span class="result-src"><span class="path">' + escapeHtml(item.source) + "</span>" +
      '<span class="section">' + escapeHtml(item.section) + "</span></span>" +
      '<span class="result-score">' + item.score.toFixed(4) + "</span>";

    var details = document.createElement("details");
    var summary = document.createElement("summary");
    summary.textContent = "查看原文";
    var snippet = document.createElement("pre");
    snippet.className = "snippet";
    snippet.textContent = item.text;
    details.appendChild(summary);
    details.appendChild(snippet);

    box.appendChild(score);
    box.appendChild(details);
    return box;
  }

  function renderResults(results, cited) {
    var citedSet = new Set(cited);
    els.results.innerHTML = "";

    if (!results.length) {
      var empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "没有文本块超过当前阈值。";
      els.results.appendChild(empty);
      return;
    }

    results.forEach(function (item) {
      els.results.appendChild(buildResult(item, citedSet));
    });
  }

  function renderCitations(results, cited) {
    var citedSet = new Set(cited);
    var citedResults = results.filter(function (item) {
      return citedSet.has(item.number);
    });

    els.citeList.innerHTML = "";
    if (!citedResults.length) {
      els.cites.hidden = true;
      return;
    }

    citedResults.forEach(function (item) {
      els.citeList.appendChild(buildCiteCard(item));
    });
    els.cites.hidden = false;
  }

  function renderResponse(data) {
    els.answerCard.hidden = false;
    renderResults(data.results || [], data.cited || []);
    renderCitations(data.results || [], data.cited || []);

    if (!data.retrieved) {
      els.answer.innerHTML = '<div class="notice">' +
        escapeHtml(data.message || "知识库中没有找到足够相关的依据。") + "</div>";
      els.meta.textContent = "召回 0 块 · " + data.elapsed_ms + " ms";
      return;
    }

    els.answer.innerHTML = renderAnswer(data.answer, data.retrieved);

    var citedText = (data.cited || []).length
      ? "引用 [" + data.cited.join("][") + "]"
      : "回答未标注引用";
    els.meta.textContent =
      "召回 " + data.retrieved + " 块 · " + citedText + " · " + data.elapsed_ms + " ms";
  }

  function ask() {
    if (loading) return;

    var question = els.question.value.trim();
    if (!question) {
      showError("请先输入问题。");
      els.question.focus();
      return;
    }

    var topK = parseInt(els.topK.value, 10);
    var minScore = parseFloat(els.minScore.value);

    clearError();
    setLoading(true);

    fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: question, top_k: topK, min_score: minScore })
    })
      .then(function (response) {
        return response.json().catch(function () {
          throw new Error("服务端返回了无法解析的内容（HTTP " + response.status + "）");
        }).then(function (data) {
          if (!response.ok) {
            var error = new Error(data.error || ("请求失败（HTTP " + response.status + "）"));
            error.payload = data;
            throw error;
          }
          return data;
        });
      })
      .then(function (data) {
        renderResponse(data);
      })
      .catch(function (error) {
        if (error.payload && error.payload.results) {
          renderResults(error.payload.results, []);
        }
        showError(error.message || "请求失败，请检查服务是否仍在运行。");
        els.answerCard.hidden = false;
        els.answer.innerHTML = '<div class="notice">生成失败，检索结果仍可在右侧查看。</div>';
        els.meta.textContent = "";
        els.cites.hidden = true;
      })
      .finally(function () {
        setLoading(false);
      });
  }

  function setUploadStatus(message, state) {
    els.uploadStatus.textContent = message;
    els.uploadStatus.className = "upload-status" + (state ? " " + state : "");
  }

  function postJSON(url, payload) {
    return fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    }).then(function (response) {
      return response.json().catch(function () {
        throw new Error("服务端返回了无法解析的内容（HTTP " + response.status + "）");
      }).then(function (data) {
        if (!response.ok) {
          throw new Error(data.error || ("请求失败（HTTP " + response.status + "）"));
        }
        return data;
      });
    });
  }

  function validateFiles(files) {
    var allowed = [".md", ".txt"];
    files.forEach(function (file) {
      var dot = file.name.lastIndexOf(".");
      var suffix = dot >= 0 ? file.name.slice(dot).toLowerCase() : "";
      if (allowed.indexOf(suffix) === -1) {
        throw new Error(file.name + " 不是 .md 或 .txt 文件");
      }
      if (file.size > 200000) {
        throw new Error(file.name + " 超过 200 KB 上限");
      }
    });
  }

  function readFiles(files) {
    return Promise.all(files.map(function (file) {
      return file.text().then(function (content) {
        return { name: file.name, content: content };
      });
    }));
  }

  function refreshIndexBadge() {
    fetch("/api/config")
      .then(function (response) { return response.json(); })
      .then(function (data) {
        els.badgeIndex.textContent = data.index_ready ? data.chunks + " 块" : "未就绪";
      })
      .catch(function () {});
  }

  function rebuildIndex(prefix) {
    var base = prefix ? prefix + " " : "";
    els.rebuildBtn.disabled = true;
    setUploadStatus(base + "正在重建索引，需要调用 Embedding 接口，请稍候…", "loading");
    return postJSON("/api/rebuild", {})
      .then(function (data) {
        setUploadStatus(
          base + "索引已更新：" + data.documents + " 个文档 / " + data.chunks +
          " 块，耗时 " + (data.elapsed_ms / 1000).toFixed(1) + " 秒",
          "success"
        );
        refreshIndexBadge();
      })
      .catch(function (error) {
        setUploadStatus(base + (error.message || "重建索引失败"), "error");
        throw error;
      })
      .finally(function () {
        els.rebuildBtn.disabled = false;
      });
  }

  function uploadFiles(kind, fileList) {
    var files = Array.from(fileList);
    if (!files.length) return;

    try {
      validateFiles(files);
    } catch (error) {
      setUploadStatus(error.message, "error");
      return;
    }

    setUploadStatus("正在上传 " + files.length + " 个文件…", "loading");
    readFiles(files)
      .then(function (items) {
        return postJSON("/api/upload", {
          kind: kind,
          files: items,
          replace_jd: kind === "jd" && els.replaceJd.checked
        });
      })
      .then(function (data) {
        return rebuildIndex("已保存 " + data.saved.length + " 个文件；");
      })
      .catch(function (error) {
        setUploadStatus(error.message || "上传失败", "error");
      });
  }

  function bindDropZone(zone, input, kind) {
    ["dragenter", "dragover"].forEach(function (name) {
      zone.addEventListener(name, function (event) {
        event.preventDefault();
        zone.classList.add("dragging");
      });
    });
    ["dragleave", "drop"].forEach(function (name) {
      zone.addEventListener(name, function (event) {
        event.preventDefault();
        zone.classList.remove("dragging");
      });
    });
    zone.addEventListener("drop", function (event) {
      if (event.dataTransfer && event.dataTransfer.files.length) {
        uploadFiles(kind, event.dataTransfer.files);
      }
    });
    input.addEventListener("change", function () {
      uploadFiles(kind, input.files);
      input.value = "";
    });
  }

  bindDropZone(document.getElementById("drop-resume"), els.fileResume, "resume");
  bindDropZone(document.getElementById("drop-jd"), els.fileJd, "jd");

  els.rebuildBtn.addEventListener("click", function () {
    if (els.rebuildBtn.disabled) return;
    rebuildIndex("").catch(function () {});
  });

  document.getElementById("examples").addEventListener("click", function (event) {
    var chip = event.target.closest(".chip");
    if (!chip) return;
    els.question.value = chip.textContent.trim();
    els.question.focus();
  });

  els.askBtn.addEventListener("click", ask);

  els.question.addEventListener("keydown", function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
      event.preventDefault();
      ask();
    }
  });

  document.addEventListener("click", function (event) {
    var cite = event.target.closest("[data-cite]");
    if (!cite) return;
    var number = cite.dataset.cite;

    var card = document.querySelector('[data-cite-card="' + number + '"]');
    if (card) {
      card.classList.add("flash");
      card.scrollIntoView({ behavior: "smooth", block: "center" });
      setTimeout(function () { card.classList.remove("flash"); }, 1600);
    }

    var result = document.querySelector('[data-result-number="' + number + '"]');
    if (result) {
      result.classList.add("flash");
      setTimeout(function () { result.classList.remove("flash"); }, 1600);
    }
  });

  var autoQuestion = new URLSearchParams(window.location.search).get("q");

  function maybeAutoAsk() {
    if (!autoQuestion) return;
    els.question.value = autoQuestion;
    ask();
  }

  fetch("/api/config")
    .then(function (response) { return response.json(); })
    .then(function (data) {
      config = data;
      els.badgeModel.textContent = data.chat_model || "—";
      els.badgeTopK.textContent = data.top_k;
      els.badgeScore.textContent = data.min_score;
      els.badgeIndex.textContent = data.index_ready
        ? data.chunks + " 块"
        : "未就绪";
      els.topK.value = data.top_k;
      els.minScore.value = data.min_score;
      if (!data.index_ready) {
        showError("索引未就绪：" + (data.index_error || "请先运行 python main.py build"));
        return;
      }
      maybeAutoAsk();
    })
    .catch(function () {
      els.badgeIndex.textContent = "离线";
      maybeAutoAsk();
    });
})();
</script>
</body>
</html>
